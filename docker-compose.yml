services:
  collector:
    build:
      context: .
      secrets:
        - maven_settings
    image: gnome-orchestrator:latest
    stop_grace_period: 75s
    privileged: true
    container_name: gnome-orchestrator-collector
    environment:
      # Reads its streams from the dev collection-shards item `local` (see CLAUDE.md) and writes minutes to final.
      SHARD_ID: local
      OUTPUT_BUCKET: gnome-market-data-dev
      RAW_CAPTURE_BUCKET: gnome-market-data-exchange-raw-dev
      MAIN_CLASS: group.gnometrading.collectors.ShardOrchestrator
      STAGE: dev
      AWS_PROFILE: dev
    volumes:
      - ~/.aws/:/root/.aws:ro
      - ./market-data:/app/market-data
    shm_size: '4gb'

  testing:
    build:
      context: .
      secrets:
        - maven_settings
    image: gnome-orchestrator:latest
    privileged: true
    container_name: gnome-orchestrator-testing
    environment:
      LISTING: 1
      MAIN_CLASS: group.gnometrading.testing.MarketDataWriterOrchestrator
      STAGE: dev
      OUTPUT: /app/market-data/output.bin
    volumes:
      - ~/.aws/:/root/.aws:ro
      - ./market-data:/app/market-data
    shm_size: '4gb'

  # A paper session run exactly as on EC2, minus the EC2 wrapper. Uses the jar built from this checkout unless
  # ORCHESTRATOR_VERSION is set; `docker compose stop strategy` sends the same SIGTERM an instance stop does.
  strategy:
    build:
      context: .
      secrets:
        - maven_settings
    image: gnome-orchestrator:latest
    container_name: gnome-orchestrator-strategy
    stop_grace_period: 60s
    environment:
      STAGE: dev
      AWS_PROFILE: dev
      AWS_REGION: us-east-1
      STRATEGY_ID: 5
      MODE: paper
      LISTINGS: "[6]"
      STRATEGY_TYPE: python
      STRATEGY_CLASS: gnomepy_research.sessions.random_trader.strategy:RandomTrader
      STRATEGY_ARGS_JSON: '{"interval_seconds": 3, "size": 10, "max_position": 3}'
      RESEARCH_COMMIT: main
      LATENCY_PROFILE: standard
      # The listing simulates with its exchange's registry parameters as recorded by then, with fees zeroed.
      SIMULATION_JSON: '{"as_of": "2026-10-16T00:00:00Z", "listings": {"6": {"fee_model": {"type": "static", "taker_fee": 0, "maker_fee": 0}}}}'
    volumes:
      - ~/.aws/:/root/.aws:ro

secrets:
  maven_settings:
    file: ~/.m2/settings.xml
