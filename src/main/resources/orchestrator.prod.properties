hyperliquid.ws.url=wss://api.hyperliquid.xyz/ws
lighter.ws.url=wss://mainnet.zklighter.elliot.ai/stream
registry.url=n5dxpwnij0.execute-api.us-east-1.amazonaws.com
registry.api.key.id=mj0thnxe96
ledger.flush.interval.ms=250
ledger.mark.interval.ms=1000
ledger.max.lag.ms=10000
ledger.ring.capacity=4096
recovery.inherit=true
kalshi.ws.url=wss://external-api-ws.kalshi.com/trade-api/ws/v2
kalshi.user.ws.url=wss://external-api-ws.kalshi.com/trade-api/ws/v2
kalshi.api.url=https://external-api.kalshi.com
journal.enabled=true
journal.bucket=gnome-journals-prod
journal.bucket.region=us-east-1
journal.segment.size.mb=256
journal.segment.interval.seconds=60
journal.directory=/var/lib/gnome/journal
polymarket.intl.ws.url=wss://ws-subscriptions-clob.polymarket.com/ws/market
polymarket.intl.user.ws.url=wss://ws-subscriptions-clob.polymarket.com/ws/user
polymarket.intl.clob.url=https://clob.polymarket.com
polymarket.us.ws.url=wss://api.polymarket.us/v1/ws/markets
polymarket.us.private.ws.url=wss://api.polymarket.us/v1/ws/private
polymarket.us.api.url=https://api.polymarket.us
polymarket.us.gateway.url=https://gateway.polymarket.us
# A live session gets kill switches faster; paper polls less since every poll is a billed registry request.
risk.live.refresh.interval.ms=5000
risk.live.stale.after.ms=30000
risk.paper.refresh.interval.ms=10000
risk.paper.stale.after.ms=60000
# Venue request budgets default to each venue's published limits (gnome-gateways VenueRateLimits). Override per
# venue as {kalshi,polymarket.intl,polymarket.us}.ratelimit.{<bucket>.per.second,<bucket>.burst,share}, e.g. for a higher tier:
# kalshi.ratelimit.write.per.second=200
# polymarket.us.ratelimit.share=0.5

# A shard's assignment: its item in the reconciler's table, in the collection control plane's one region.
collection.shards.table=collection-shards
collection.region=us-east-1
# Where a shard writes its status for the reconciler: collection/shards/<shard>/status/<task>.json.
status.bucket=gnome-market-data-metadata-prod
# The release a shard runs, for its status (the container sets ORCHESTRATOR_VERSION).
orchestrator.version=unknown
# How long a session reading from shards waits for its streams to go live; under the registry's START_STUCK (15 min).
market.data.start.timeout.seconds=600
# How long the market-data path's threads may park when idle, in µs; a park delays a record that arrives during it.
# A shard's (publisher and driver) saves every session reading it; a session's (driver and ingress) only itself, and on
# a t3 its extra wake-ups cost more than its credits cover, so sessions keep 1 ms unless their config lowers it.
shard.market.data.idle.max.park.micros=50
market.data.idle.max.park.micros=1000

# An order gateway (Main gateway, GATEWAY_KEY live:<exchange>:<instance>): the most orders one venue account may have
# working at once across every session, and the HTTP connections each account's orders go out on at once.
gateway.max.orders=4096
gateway.lane.connections=8
# enforce refuses an order that would trade against another session's; shadow sends it and counts it.
gateway.self.trade.mode=enforce
# Caps a session may hold and send, and the account. A session can ask for less (order.gateway.max.open.orders,
# order.gateway.max.new.per.second), never more. Cancels are never capped.
gateway.session.max.open.orders=200
gateway.session.max.new.per.second=50
gateway.account.max.open.orders=2000
# How long the gateway's Aeron-path threads (media driver, ingress, egress) may park when idle, in µs: each park delays
# an order or report arriving during it, and every session's orders pass through.
gateway.idle.max.park.micros=50
# The UDP port sessions send to (one of 40010-40019, gnome-shared-cdk AERON_PORT_MAP), and how many reports each
# session's replay ring keeps for a reconnect.
gateway.ingress.port=40010
gateway.replay.reports=8192
# The gateway exits (ECS restarts it) when ingress, egress, a lane or an account's reader makes no progress this long.
gateway.watchdog.stall.millis=3000
# Where the gateway keeps what a restart takes back (per account, which session owns each order; the sessions it
# accepted): the host's volume, which outlives the container. A full ownership log is rewritten with the open orders.
gateway.state.directory=/var/lib/gnome/gateway
gateway.ownership.log.mb=64

# A live session's orders go through the venue's order gateway (live:<exchange>:main), found in the service-endpoints
# table; order.gateway.local=<ip>:<port> names a gateway for a local run instead.
order.gateway.local=
# Cancel the session's orders when the gateway hears nothing from it for this long.
order.gateway.cod.timeout.ms=5000
order.gateway.max.queue.ms=50
# How long a starting session waits for its gateways to welcome it, asking the registry to start each every 10 s (a
# gateway started from nothing takes minutes: a host, its image, the release, its venue connections); and how many
# orders it tracks, and how many cancels it holds for a link that is down.
order.gateway.start.timeout.seconds=600
order.gateway.max.orders=4096
order.gateway.pending.messages=1024
