# A live session gets kill switches faster; paper polls less since every poll is a billed registry request.
risk.live.refresh.interval.ms=5000
risk.live.stale.after.ms=30000
risk.paper.refresh.interval.ms=10000
risk.paper.stale.after.ms=60000
# Venue request budgets default to each venue's published limits (gnome-gateways VenueRateLimits). Override per
# venue as {kalshi,polymarket.intl,polymarket.us}.ratelimit.{<bucket>.per.second,share}, e.g. for a higher tier:
# kalshi.ratelimit.write.per.second=200
# polymarket.us.ratelimit.share=0.5

# A shard's assignment: its item in the reconciler's table, in the collection control plane's one region.
collection.shards.table=collection-shards
collection.region=us-east-1
# Where a shard writes its status for the reconciler: collection/shards/<shard>/status/<task>.json.
status.bucket=gnome-market-data-metadata-dev
# The release a shard runs, for its status (the container sets ORCHESTRATOR_VERSION).
orchestrator.version=unknown
